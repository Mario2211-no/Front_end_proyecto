    <main>
        <div class="contacto">
            <h1>Ponte en contacto</h1>
            <p>Envianos tus comentarios o sugerencias llenando el siguiente formulario:</p>
            <form action="https://formspree.io/f/xoevpbpj" method="POST"> <!--Form de Formspress-->
                <div class="form_i">
                    <label for="text">Nombre:</label>
                    <input type="text" name="name" id="name" notnull>
                </div>
                <div class="form_i">
                    <label for="email">Correo electronico:</label>
                    <input type="email" name="email" id="email" notnull>
                </div>
                <div class="form_i">
                    <label for="text">Asunto:</label>
                    <input type="text" name="asunto">
                </div>
                <div class="form_i">
                    <label for="mensaje">Mensaje:</label>
                    <textarea name="mensaje" id="mensaje" cols="20" rows="3"></textarea>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </main>
